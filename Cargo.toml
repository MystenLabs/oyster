[workspace]
members = ["crates/oyster", "crates/oyster-cli", "crates/oyster-e2e-tests", "crates/pearl"]
resolver = "3"

[workspace.dependencies]
# Existing (already hoisted)
async-trait = "0.1.89"
chrono = { version = "0.4.44", features = ["serde"] }
clap = { version = "4.5.60", features = ["derive"] }
reqwest = { version = "0.13.2", features = ["json"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sqlx = { version = "0.8.6", features = ["runtime-tokio", "sqlite", "postgres", "any", "migrate"] }
thiserror = "2.0.18"
tokio = { version = "1.49.0", features = ["full"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.22", features = ["env-filter"] }
uuid = { version = "1.21.0", features = ["v4", "serde"] }
aws-credential-types = "1.2.14"
aws-lc-sys = "0.38.0"
aws-sdk-s3 = "1.126.0"

# Newly hoisted — crates.io
axum = "0.8.8"
futures = "0.3.32"
base64 = "0.22.1"
bcs = "0.1.6"
blake2 = "0.10.6"
ed25519-dalek = "2.2.0"
hex = "0.4.3"
hkdf = "0.12.4"
http-body-util = "0.1.3"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
prost = "0.14.3"
rand = "0.10.0"
rustls = { version = "0.23.37", features = ["aws-lc-rs"] }
s3s = "0.13.0"
sha2 = "0.10.9"
subtle = "2.6.1"
tempfile = "3.25.0"
time = "0.3.47"
tokio-stream = "0.1.18"
tonic = "0.14.5"
tonic-build = "0.14.5"
tonic-health = "0.14.5"
tonic-prost = "0.14.5"
tonic-prost-build = "0.14.5"
tower = { version = "0.5.3", features = ["util"] }
tower-http = { version = "0.6.8", features = ["cors", "set-header", "trace"] }
url = "2.5.8"
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
zeroize = "1.8.2"

# Sui ecosystem — single version across workspace
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "5f87e04bb21d295ef6b39375a06615d45cbb906c" }
shared-crypto = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.71.0" }
sui-sdk = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.71.0" }
sui-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.71.0" }

# Walrus ecosystem — single version across workspace
walrus-core = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.48.1" }
walrus-sdk = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.48.1" }
walrus-service = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.48.1" }
walrus-sui = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.48.1" }
walrus-test-utils = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.48.1" }
walrus-utils = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.48.1" }

# Internal path deps
oyster = { path = "crates/oyster" }
pearl = { path = "crates/pearl" }

[workspace.lints.rust]
missing_docs = "deny"
