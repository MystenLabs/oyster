name: Deploy Docs

# The Oyster documentation moved to MystenLabs/walrus-documentation and is
# published at https://docs.wal.app/oyster. This keeps the old GitHub Pages
# site, https://mystenlabs.github.io/oyster/, serving a redirect there so
# existing links keep working.

on:
  push:
    branches: [main]
    paths:
      - .github/pages-redirect/**
      - .github/workflows/docs.yml
  workflow_dispatch:

# Required for GitHub Pages deployment via Actions
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .github/pages-redirect
      - id: deployment
        uses: actions/deploy-pages@v4
