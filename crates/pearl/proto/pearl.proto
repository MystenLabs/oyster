syntax = "proto3";

package pearl;

service Pearl {
  rpc CreateAccount(CreateAccountRequest) returns (CreateAccountResponse);
  rpc GetAccountWallets(GetAccountWalletsRequest) returns (GetAccountWalletsResponse);
  rpc SignTransaction(SignTransactionRequest) returns (SignTransactionResponse);
  rpc GetBalance(GetBalanceRequest) returns (GetBalanceResponse);
  rpc ConfirmTransaction(ConfirmTransactionRequest) returns (ConfirmTransactionResponse);
}

message CreateAccountRequest {
  int64 min_sui_balance = 1;
  int64 min_wal_balance = 2;
  int64 top_up_target_sui = 3;
  int64 top_up_target_wal = 4;
}

message CreateAccountResponse {
  string account_id = 1;
  string address = 2;
}

message GetAccountWalletsRequest {
  string account_id = 1;
}

message GetAccountWalletsResponse {
  repeated WalletInfo wallets = 1;
}

message WalletInfo {
  string account_id = 1;
  string address = 2;
  int64 min_sui_balance = 3;
  int64 min_wal_balance = 4;
  int64 top_up_target_sui = 5;
  int64 top_up_target_wal = 6;
}

message SignTransactionRequest {
  bytes tx_data = 1;
  string account_id = 2;
  int64 estimated_sui_cost = 3;
  int64 estimated_wal_cost = 4;
}

message SignTransactionResponse {
  bytes signed_transaction = 1;
  string pending_transaction_id = 2;
}

message GetBalanceRequest {
  string account_id = 1;
}

message GetBalanceResponse {
  string account_id = 1;
  int64 cached_sui_balance = 2;
  int64 cached_wal_balance = 3;
  int64 min_sui_balance = 4;
  int64 min_wal_balance = 5;
  string balance_updated_at = 6;
}

message ConfirmTransactionRequest {
  string pending_transaction_id = 1;
  string tx_digest = 2;
  bool success = 3;
  int64 actual_sui_cost = 4;
  int64 actual_wal_cost = 5;
}

message ConfirmTransactionResponse {
  int64 cached_sui_balance = 1;
  int64 cached_wal_balance = 2;
}
