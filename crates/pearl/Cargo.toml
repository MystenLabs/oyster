[package]
name = "pearl"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
bcs = "0.1.6"
chrono = { workspace = true, features = ["serde"] }
fastcrypto = { git = "https://github.com/MystenLabs/fastcrypto", rev = "db643fd05a1b1c4cd52de3939766b53e12ce137e", version = "0.1.9" }
hex = "0.4.3"
hkdf = "0.12.4"
metrics = "0.24.3"
metrics-exporter-prometheus = "0.18.1"
prost = "0.14.3"
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10.9"
shared-crypto = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.66.1", version = "0.0.0" }
sqlx = { workspace = true, features = ["runtime-tokio", "sqlite", "migrate"] }
subtle = "2.6.1"
sui-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.66.1", version = "0.1.0" }
thiserror.workspace = true
tokio = { workspace = true }
tonic = { version = "0.14.5", features = ["default", "tls-aws-lc"] }
tonic-health = "0.14.5"
tonic-prost = "0.14.5"
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
uuid = { workspace = true, features = ["v4", "serde"] }
zeroize = "1.8.2"

[lints]
workspace = true

[build-dependencies]
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"

[dev-dependencies]
tokio-stream = "0.1.18"
