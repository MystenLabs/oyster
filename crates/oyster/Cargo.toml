[package]
name = "oyster"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.8"
base64 = "0.22.1"
bcs = "0.1.6"
blake2 = "0.10.6"
chrono = { workspace = true }
clap = { workspace = true, features = ["derive"] }
hex = "0.4.3"
prost = "0.14.3"
rand = "0.10.0"
reqwest = { version = "0.13.2", features = ["json"] }
rustls = { version = "0.23.37", features = ["aws-lc-rs"] }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sui-sdk = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.65.1" }
sui-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.65.1" }
thiserror = { workspace = true }
tokio = { workspace = true }
tonic = { version = "0.14.5", features = ["tls-aws-lc", "tls-webpki-roots"] }
tonic-prost = "0.14.5"
tower-http = { version = "0.6.8", features = ["cors", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
utoipa = { version = "5.4.0", features = ["axum_extras"] }
utoipa-axum = "0.2.0"
utoipa-scalar = { version = "0.3.0", features = ["axum"] }
uuid = { workspace = true }
walrus-core = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.42.1", version = "1.42.1", features = ["sui-types"] }
walrus-sdk = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.42.1", version = "1.42.1" }
walrus-sui = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.42.1", version = "1.42.1" }
walrus-utils = { git = "https://github.com/MystenLabs/walrus", tag = "testnet-v1.42.1", features = ["backoff"] }

[dev-dependencies]
http-body-util = "0.1.3"
pearl = { path = "../pearl" }
tempfile = "3.25.0"
tokio-stream = "0.1.18"
tower = { version = "0.5.3", features = ["util"] }
wiremock = "0.6.5"

[lints]
workspace = true

[build-dependencies]
tonic-build = "0.14.5"
tonic-prost-build = "0.14.5"
