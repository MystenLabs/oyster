[package]
name = "oyster"
version = "0.10.2"
edition = "2024"
publish = false

[[bin]]
name = "oysterd"
path = "src/main.rs"

[dependencies]
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bcs = { workspace = true }
blake2 = { workspace = true }
bytestring = "1.5.0"
chrono = { workspace = true }
clap = { workspace = true }
ed25519-dalek = { workspace = true }
form_urlencoded = "1.2.2"
futures = { workspace = true }
hex = { workspace = true }
hyper = "1.8.1"
md5 = "0.8.0"
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
prost = { workspace = true }
rand = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
s3s = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
sui-sdk = { workspace = true }
sui-types = { workspace = true }
thiserror = { workspace = true }
time = { workspace = true }
tokio = { workspace = true }
tonic = { workspace = true, features = ["tls-aws-lc", "tls-webpki-roots"] }
tonic-health = { workspace = true }
tonic-prost = { workspace = true }
tower-http = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
url = { workspace = true }
utoipa = { workspace = true }
utoipa-axum = { workspace = true }
utoipa-scalar = { workspace = true }
uuid = { workspace = true }
walrus-core = { workspace = true, features = ["sui-types"] }
walrus-sdk = { workspace = true }
walrus-sui = { workspace = true }
walrus-utils = { workspace = true, features = ["backoff"] }

[dev-dependencies]
http-body-util = { workspace = true }
pearl = { workspace = true }
sqlx.workspace = true
tempfile = { workspace = true }
tokio-stream = { workspace = true }
tower = { workspace = true }
uuid.workspace = true
zeroize = { workspace = true }

[lints]
workspace = true

[build-dependencies]
tonic-build = { workspace = true }
tonic-prost-build = { workspace = true }
