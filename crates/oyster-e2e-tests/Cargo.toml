[package]
name = "oyster-e2e-tests"
version = "0.11.1"
edition = "2024"
publish = false

# This crate has no library or binary — it exists only for integration tests.
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
oyster = { workspace = true }
pearl = { workspace = true }

axum = { workspace = true }
hex = { workspace = true }
http-body-util = { workspace = true }
reqwest = { workspace = true }
rustls = { workspace = true }
serde_json = { workspace = true }
sui-sdk = { workspace = true }
sui-types = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tonic = { workspace = true }
tonic-health = { workspace = true }
tower = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
walrus-sdk = { workspace = true }
walrus-service = { workspace = true, features = ["test-utils"] }
walrus-sui = { workspace = true, features = ["test-utils"] }
walrus-test-utils = { workspace = true }
zeroize = { workspace = true }
uuid = { workspace = true, features = ["v4"] }
assert_cmd = "2.1.2"
predicates = "3.1.4"
tempfile = { workspace = true }
aws-sdk-s3 = { workspace = true }
aws-credential-types = { workspace = true }
walrus-core.workspace = true

[dev-dependencies]
oyster-cli = { path = "../oyster-cli" }
