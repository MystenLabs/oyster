[package]
name = "oyster-e2e-tests"
version = "0.1.0"
edition = "2024"
publish = false

# This crate has no library or binary — it exists only for integration tests.
[lints]
workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
oyster = { path = "../oyster" }
pearl = { path = "../pearl" }

axum = "0.8.8"
http-body-util = "0.1.3"
reqwest = { version = "0.13.2", features = ["json"] }
serde_json = { workspace = true }
tokio = { workspace = true }
tokio-stream = "0.1.18"
tonic = "0.14.5"
tower = { version = "0.5.3", features = ["util"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
rustls = { version = "0.23", features = ["aws-lc-rs"] }

# Sui (same version as walrus uses).
sui-sdk = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.66.1" }
sui-types = { git = "https://github.com/MystenLabs/sui", tag = "testnet-v1.66.1" }

# Walrus test infrastructure (path deps to local walrus checkout).
walrus-sdk = { path = "../../../walrus/crates/walrus-sdk" }
walrus-service = { path = "../../../walrus/crates/walrus-service", features = ["test-utils"] }
walrus-sui = { path = "../../../walrus/crates/walrus-sui", features = ["test-utils"] }
walrus-test-utils = { path = "../../../walrus/crates/walrus-test-utils" }
hex = "0.4.3"
zeroize = "1.8.2"
tonic-health = "0.14.5"
